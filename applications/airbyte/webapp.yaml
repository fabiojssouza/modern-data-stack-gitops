apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-webapp
  namespace: data-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte-webapp
  template:
    metadata:
      labels:
        app: airbyte-webapp
    spec:
      containers:
      - name: airbyte-webapp
        image: airbyte/webapp:0.50.33
        ports:
        - containerPort: 80
        env:
        - name: AIRBYTE_VERSION
          value: "0.50.33"
        - name: API_URL
          value: "http://airbyte-server:8001/api/v1/"
        - name: INTERNAL_API_HOST
          value: "airbyte-server:8001"
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-webapp
  namespace: data-stack
spec:
  selector:
    app: airbyte-webapp
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airbyte-ingress
  namespace: data-stack
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - secretName: airbyte-tls
      hosts:
        - airbyte.kube.dev.dissertio.com.br
  rules:
    - host: airbyte.kube.dev.dissertio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airbyte-webapp
                port:
                  number: 80
