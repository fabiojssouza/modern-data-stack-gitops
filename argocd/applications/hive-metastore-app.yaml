apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
 name: hive-metastore
 namespace: argocd
spec:
 project: data-stack
 source:
 repoURL: https://github.com/fabiojssouza/modern-data-stack-gitops
 targetRevision: HEAD
 path: infrastructure/hive-metastore
 destination:
 server: https://kubernetes.default.svc
 namespace: data-stack
 syncPolicy:
 automated:
 prune: true
 selfHeal: true
 syncOptions:
 - CreateNamespace=true
