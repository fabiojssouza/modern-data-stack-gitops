apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: data-stack
  source:
    repoURL: https://github.com/fabiojssouza/modern-data-stack-gitops
    targetRevision: develop
    path: infrastructure/minio
    chart: minio
    targetRevision: 12.6.4
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
