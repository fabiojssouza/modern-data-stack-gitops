apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: data-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
      - name: schema-init
        image: apache/hive:3.1.3
        command:
        - /bin/bash
        - -c
        args:
        - |
          echo "Initializing schema..."
          /opt/hive/bin/schematool -dbType postgres -initSchema
          echo "Schema initialized successfully"
        env:
        - name: HIVE_CONF_DIR
          value: /opt/hive/conf
        volumeMounts:
        - name: hive-config
          mountPath: /opt/hive/conf/metastore-site.xml
          subPath: metastore-site.xml
      containers:
      - name: hive-metastore
        image: apache/hive:3.1.3
        command:
        - /bin/bash
        - -c
        args:
        - |
          echo "Starting Hive Metastore..."
          /opt/hive/bin/hive --service metastore
        ports:
        - containerPort: 9083
        env:
        - name: HIVE_CONF_DIR
          value: /opt/hive/conf
        volumeMounts:
        - name: hive-config
          mountPath: /opt/hive/conf/metastore-site.xml
          subPath: metastore-site.xml
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
          requests:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 9083
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9083
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: hive-config
        configMap:
          name: hive-metastore-config
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: data-stack
spec:
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      targetPort: 9083
      name: thrift
  type: ClusterIP
