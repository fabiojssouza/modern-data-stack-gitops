apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: data-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "leads_db"
        - name: POSTGRES_USER
          value: "leads_user"
        - name: POSTGRES_PASSWORD
          value: "leads_password_123"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "trust"
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: data-stack
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
