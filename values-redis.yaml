apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: data-stack
  labels:
    app: redis
spec:
  containers:
  - name: redis
    image: redis:7-alpine
    ports:
    - containerPort: 6379
    command:
    - redis-server
    - --appendonly
    - "yes"
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data-stack
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
